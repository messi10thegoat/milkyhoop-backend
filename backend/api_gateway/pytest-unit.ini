# Konfigurasi untuk suite UNIT (fungsi murni, nol HTTP/LLM/DB) + suite Milkybook (tests/milkybook, putusan MASTER 24 Okt:
# inti Milkybook wajib ikut gerbang merge; SATU pemanggilan pytest = satu baris ringkasan yang dibaca mh-gerbang-merge).
#
# Terpisah dari pytest.ini yang ada karena pytest.ini memaksa --cov pada modul
# auth dengan --cov-fail-under=40; itu relevan untuk suite auth, tapi membuat
# tiap tes unit menuntut pytest-cov dan gagal karena ambang cakupan yang tak
# ada hubungannya. Memisahkannya = nol perubahan pada suite yang sudah ada.
[pytest]
testpaths = tests/unit tests/milkybook
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
addopts = --verbose --tb=short -p no:cacheprovider --confcutdir=tests/unit
filterwarnings =
    ignore::DeprecationWarning
