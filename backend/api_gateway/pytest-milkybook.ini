# Suite Milkybook (inti + paket): fungsi murni, model palsu, BE palsu. Nol HTTP/LLM/DB.
# Terpisah dari pytest-unit.ini karena conftest unit mengimpor pipeline chat lama (paket openai dsb.).
[pytest]
testpaths = tests/milkybook
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
addopts = --tb=short -p no:cacheprovider --confcutdir=tests/milkybook
filterwarnings =
    ignore::DeprecationWarning
