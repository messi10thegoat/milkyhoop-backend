scenarios:
- id: MT-001
  category: multi_turn
  description: Context carry - customer name should persist across turns
  messages:
  - saya mau buat faktur ke Grapgrap Clothing
  - Kaos Oblong 24s 10 pcs
  expect_behavior:
  - text_response
  expect_action_type: CREATE_SALES_INVOICE
  expect_contains:
  - Grapgrap
  tags:
  - multi_turn
  - context_carry
  timeout_seconds: 90
