scenarios:
- id: API-001
  category: action_purchase_invoice
  description: Direct complete purchase invoice with vendor, item, quantity, and price
  messages:
  - buat faktur pembelian dari PT Wave4 Regression, Kaos Oblong 24s 100 pcs harga 25000
  expect_behavior:
  - propose_action
  expect_action_type: CREATE_PURCHASE_INVOICE
  expect_contains:
  - PT Wave4 Regression
  - Kaos Oblong
  tags:
  - action
  - purchase
  - direct
  timeout_seconds: 60
