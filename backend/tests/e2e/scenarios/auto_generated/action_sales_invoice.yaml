scenarios:
- id: ASI-001
  category: action_sales_invoice
  description: Direct complete sales invoice request with customer, item, and quantity
  messages:
  - buat faktur penjualan ke Grapgrap Clothing, Kaos Oblong Gramasi 24s 10 pcs
  expect_behavior:
  - propose_action
  expect_action_type: CREATE_SALES_INVOICE
