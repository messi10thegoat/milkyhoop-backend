scenarios:
- id: AMD-001
  category: action_master_data
  description: Create customer with name and phone number
  messages:
  - 'tambah pelanggan baru: PT Maju Jaya, telepon 081234567890'
  expect_behavior:
  - propose_action
  expect_action_type: CREATE_CUSTOMER
  expect_contains:
  - Maju Jaya
  tags:
  - master_data
  - customer
  timeout_seconds: 30
- id: AMD-002
  category: action_master_data
  description: Create vendor with name and email
  messages:
  - daftarkan vendor baru PT Sumber Makmur, email sumber@email.com
  expect_behavior:
  - propose_action
  expect_action_type: CREATE_VENDOR
  expect_contains:
  - Sumber Makmur
  tags:
  - master_data
  - vendor
  timeout_seconds: 30
